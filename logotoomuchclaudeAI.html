<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Déclaration du viewport pour un affichage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo SVG Complexe - Version Commentée</title>
    <style>
      /* ---------------------------------------------------------------
       STYLE DU CORPS DE PAGE
       Ajustez ici les propriétés du body pour modifier l'affichage général
    ---------------------------------------------------------------- */
      body {
        margin: 0; /* Supprime les marges par défaut */
        padding: 0; /* Supprime les espacements internes */
        display: flex; /* Utilisation de Flexbox pour centrer le contenu */
        justify-content: center; /* Centre horizontalement */
        align-items: center; /* Centre verticalement */
        min-height: 100vh; /* Hauteur minimale égale à 100% de la hauteur de la fenêtre */
        background: #0f0f1e; /* Couleur de fond sombre (modifiable) */
        overflow: hidden; /* Masque tout débordement */
      }

      /* ---------------------------------------------------------------
       CONTAINER PRINCIPAL POUR LE LOGO
       Ajustez la taille (width, height) et la transition de transformation
    ---------------------------------------------------------------- */
      .logo-container {
        width: 600px; /* Largeur du conteneur (modifiable) */
        height: 600px; /* Hauteur du conteneur (modifiable) */
        position: relative;
        transition: transform 0.3s ease-out; /* Transition pour l'effet interactif */
      }

      /* ---------------------------------------------------------------
       STYLE DE L'ÉLÉMENT SVG
       Le SVG occupe toute la taille du conteneur et bénéficie d'un drop-shadow
    ---------------------------------------------------------------- */
      svg {
        width: 100%; /* Utilise toute la largeur du conteneur */
        height: 100%; /* Utilise toute la hauteur du conteneur */
        filter: drop-shadow(0 0 10px rgba(0, 183, 255, 0.4));
        /* Paramètres du drop-shadow :
         - décalage X : 0
         - décalage Y : 0
         - flou : 10px
         - couleur : rgba(0, 183, 255, 0.4) (modifiable)
      */
      }

      /* ---------------------------------------------------------------
       ANIMATION "PULSE" (effet de battement)
       Ajustez la durée (4s) ou les transformations pour modifier l'effet
    ---------------------------------------------------------------- */
      .pulse {
        animation: pulse 4s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1); /* Échelle normale */
          filter: hue-rotate(0deg); /* Aucune rotation de teinte */
        }
        50% {
          transform: scale(
            1.05
          ); /* Légère augmentation de la taille (modifiable) */
          filter: hue-rotate(30deg); /* Rotation de teinte à 30° (modifiable) */
        }
        100% {
          transform: scale(1); /* Retour à l'échelle normale */
          filter: hue-rotate(0deg); /* Retour à la teinte originale */
        }
      }

      /* ---------------------------------------------------------------
       ANIMATION "SPIN" (rotation continue)
       Ajustez la durée (20s ici) pour changer la vitesse de rotation
    ---------------------------------------------------------------- */
      .spin {
        animation: spin 2s linear infinite;
        transform-origin: center; /* Centre de rotation */
        transform-box: fill-box; /* Définit la boîte de transformation */
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        } /* Pas de rotation au début */
        100% {
          transform: rotate(360deg);
        } /* Rotation complète sur 360° */
      }

      /* ---------------------------------------------------------------
       ANIMATION "SPARKLE" (effet de scintillement)
       Vous pouvez ajuster la durée et les valeurs d'opacité pour personnaliser
    ---------------------------------------------------------------- */
      .sparkle {
        animation: sparkle 3s infinite;
      }

      @keyframes sparkle {
        0% {
          opacity: 0.2;
        } /* Opacité minimale */
        50% {
          opacity: 1;
        } /* Opacité maximale */
        100% {
          opacity: 0.2;
        } /* Retour à l'opacité minimale */
      }

      /* ---------------------------------------------------------------
       ANIMATION "FLOAT" (effet de flottement vertical)
       Modifiez la durée (6s) ou la translation verticale pour ajuster l'effet
    ---------------------------------------------------------------- */
      .float {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-15px);
        } /* Décalage vertical de -15px (modifiable) */
        100% {
          transform: translateY(0px);
        }
      }
    </style>
  </head>
  <body>
    <!-- CONTAINER PRINCIPAL DU LOGO -->
    <div class="logo-container">
      <!-- SVG principal avec vue de 800x800 et animation de pulse -->
      <svg
        viewBox="0 0 800 800"
        xmlns="http://www.w3.org/2000/svg"
        class="pulse"
      >
        <!-- ===================================================================
           DÉFINITIONS DES GRADIENTS, FILTRES ET MOTIFS
           (Paramètres ajustables pour changer les couleurs, intensités, etc.)
      =================================================================== -->
        <defs>
          <!-- Dégradé radial pour le fond principal -->
          <radialGradient
            id="bg-gradient"
            cx="50%"
            cy="50%"
            r="50%"
            fx="50%"
            fy="50%"
          >
            <stop offset="0%" stop-color="#1a1a3a" />
            <!-- Couleur au centre -->
            <stop offset="70%" stop-color="#0f0f2a" />
            <!-- Couleur intermédiaire -->
            <stop offset="100%" stop-color="#07071a" />
            <!-- Couleur en périphérie -->
          </radialGradient>

          <!-- Dégradé linéaire pour les éléments bleus -->
          <linearGradient
            id="blue-gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#00b7ff" />
            <stop offset="50%" stop-color="#0073ff" />
            <stop offset="100%" stop-color="#0044ff" />
          </linearGradient>

          <!-- Dégradé linéaire pour les éléments violets -->
          <linearGradient
            id="purple-gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#b700ff" />
            <stop offset="50%" stop-color="#7300ff" />
            <stop offset="100%" stop-color="#4400ff" />
          </linearGradient>

          <!-- Dégradé linéaire pour le cercle extérieur lumineux -->
          <linearGradient
            id="outer-gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#00b7ff" stop-opacity="0.1" />
            <stop offset="50%" stop-color="#0073ff" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#0044ff" stop-opacity="0.1" />
          </linearGradient>

          <!-- Filtre de flou pour créer un effet de glow -->
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <!-- stdDeviation définit l'intensité du flou -->
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <!-- Motif en grille pour une texture de fond -->
          <pattern
            id="grid"
            width="20"
            height="20"
            patternUnits="userSpaceOnUse"
          >
            <path
              d="M 20 0 L 0 0 0 20"
              fill="none"
              stroke="#ffffff"
              stroke-width="0.5"
              stroke-opacity="0.1"
            />
          </pattern>

          <!-- Motif en cercles pour une texture alternative -->
          <pattern
            id="circles"
            width="30"
            height="30"
            patternUnits="userSpaceOnUse"
          >
            <circle cx="15" cy="15" r="2" fill="#ffffff" fill-opacity="0.1" />
          </pattern>

          <!-- Filtre pour les éléments brillants avec flou (shine) -->
          <filter id="shine" x="-50%" y="-50%" width="200%" height="200%">
            <!-- stdDeviation ici ajuste la diffusion du flou -->
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <!-- Clip-path pour limiter l'affichage à un cercle -->
          <clipPath id="circle-clip">
            <circle cx="400" cy="400" r="350" />
          </clipPath>

          <!-- Dégradé pour le texte -->
          <linearGradient
            id="text-gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#b0b0ff" />
          </linearGradient>
        </defs>

      =================================================================== -->

        <!-- Superposition du motif en grille pour la texture -->
        <circle cx="400" cy="400" r="380" fill="url(#grid)" />

        <!-- ===================================================================

        <g class="spin">

          <circle

        <g class="sparkle">

    <!-- ===================================================================
       SCRIPT JAVASCRIPT POUR LES EFFETS INTERACTIFS
       (Les paramètres ici affectent la création de particules et l'interaction de la souris)
  =================================================================== -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // --------------------------------------------------------------------
        // Fonction pour créer des particules dynamiques dans le SVG
        // --------------------------------------------------------------------
        function createParticles() {
          const svgNS = "http://www.w3.org/2000/svg"; // Namespace pour la création d'éléments SVG
          const svg = document.querySelector("svg");
          const particlesGroup = document.createElementNS(svgNS, "g");
          particlesGroup.setAttribute("class", "dynamic-particles");

          // Création de 50 particules avec des paramètres aléatoires
          for (let i = 0; i < 50; i++) {
            const particle = document.createElementNS(svgNS, "circle");
            // Position aléatoire sur l'axe X (0 à 800, correspondant à la vue du SVG)
            const x = Math.random() * 800;
            // Position aléatoire sur l'axe Y
            const y = Math.random() * 800;
            // Taille de la particule : ajustez la formule pour modifier la plage (ici entre 0.5 et 2.5)
            const size = Math.random() * 2 + 0.5;
            // Opacité aléatoire pour varier la luminosité (entre 0.1 et 0.6)
            const opacity = Math.random() * 0.5 + 0.1;

            particle.setAttribute("cx", x);
            particle.setAttribute("cy", y);
            particle.setAttribute("r", size);
            particle.setAttribute("fill", "#00b7ff");
            particle.setAttribute("opacity", opacity);
            particle.setAttribute("class", "sparkle");

            // Animation de scintillement aléatoire pour chaque particule
            // La durée d'animation est définie entre 2 et 6 secondes (modifiable)
            const animDuration = Math.random() * 4 + 2;
            particle.style.animation = `sparkle ${animDuration}s infinite`;

            particlesGroup.appendChild(particle);
          }
          // Ajoute le groupe de particules au SVG
          svg.appendChild(particlesGroup);
        }

        // Appel de la fonction pour générer les particules dynamiques
        createParticles();

        // --------------------------------------------------------------------
        // Effet interactif : légère rotation 3D du conteneur en fonction de la position de la souris
        // --------------------------------------------------------------------
        const logo = document.querySelector(".logo-container");
        logo.addEventListener("mousemove", function (e) {
          // Récupération des coordonnées du conteneur
          const rect = this.getBoundingClientRect();
          // Calcul de la position de la souris relative au conteneur
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          // Calcul des deltas pour la rotation (diviseur modifiable pour intensifier ou diminuer l'effet)
          const deltaX = (x - centerX) / 50;
          const deltaY = (y - centerY) / 50;

          // Application d'une transformation 3D avec perspective
          this.style.transform = `perspective(1000px) rotateY(${-deltaX}deg) rotateX(${deltaY}deg)`;
        });

        // Réinitialise la transformation lorsque la souris quitte le conteneur
        logo.addEventListener("mouseleave", function () {
          this.style.transform =
            "perspective(1000px) rotateY(0deg) rotateX(0deg)";
        });
      });
    </script>
